[tools]
claude-code = "latest"
go = "latest"
helm = "latest"
node = "latest"
"npm:typescript" = "latest"
poetry = "latest"
python = "latest"

[settings]
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["python", "node", "elixir"]
dotfiles.root = "~/dotfiles"
dotfiles.relative_symlinks = true
# История дотфайлов ведётся в git, встроенная история mise не нужна
history.enabled = false

[env]

# Пакеты, которые stow раскладывал по файлам
[dotfile_groups.zsh]
root = "zsh"

# Пакеты, которые stow линковал директорией целиком
[dotfiles]
"~/.config/nvim" = { source = "~/dotfiles/nvim/.config/nvim", mode = "symlink" }
# tmux не используется, конфиг оставлен в репо: раскомментировать, чтобы вернуть
# "~/.config/tmux" = { source = "~/dotfiles/tmux/.config/tmux", mode = "symlink" }
"~/.config/ghostty" = { source = "~/dotfiles/ghostty/.config/ghostty", mode = "symlink" }
"~/.config/karabiner" = { source = "~/dotfiles/karabiner/.config/karabiner", mode = "symlink" }

# Отдельные файлы
"~/.config/mise/config.toml" = { source = "~/dotfiles/mise/.config/mise/config.toml", mode = "symlink" }
"~/.gitconfig" = { source = "~/dotfiles/git/gitconfig", mode = "symlink" }
"~/.gitexcludes" = { source = "~/dotfiles/git/gitexclude", mode = "symlink" }

# oh-my-zsh, тема и плагины; ZSH_CUSTOM задан в .zshrc
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/.zsh-custom/themes/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git", depth = 1 }
"~/.zsh-custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }
"~/.zsh-custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.zsh-custom/plugins/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions.git" }

